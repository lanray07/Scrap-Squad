name: Validate native game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate package, tooling and iOS build
        run: bash Tools/verify_macos.sh
      - name: Package simulator app
        run: |
          mkdir -p .build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            .build/ios-derived/Build/Products/Debug-iphonesimulator/ScrapSquad.app \
            .build/artifacts/ScrapSquad-simulator.zip
      - name: Save simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ScrapSquad-simulator-${{ github.run_number }}
          path: .build/artifacts/ScrapSquad-simulator.zip
          if-no-files-found: error
      - name: Run iPhone simulator smoke tests
        timeout-minutes: 10
        run: bash Tools/test_ios_ui.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d .build/ios-ui-tests.xcresult ]; then
            mkdir -p .build/artifacts/screenshots
            xcrun xcresulttool export attachments \
              --path .build/ios-ui-tests.xcresult \
              --output-path .build/artifacts/screenshots
          fi
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots-${{ github.run_number }}
          path: .build/artifacts/screenshots
          if-no-files-found: ignore
      - name: Export premium store screenshot pack
        if: success()
        run: |
          python3 Tools/collect_store_captures.py .build/artifacts/screenshots Docs/Store/Captures
          npm install --prefix .build/screenshot-tools --no-save sharp
          NODE_PATH="$PWD/.build/screenshot-tools/node_modules" node Tools/render_store_screenshots.cjs Docs/Store/Captures
      - name: Save premium store screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ github.run_number }}
          path: |
            Docs/Store/Screenshots/en-GB
            Docs/Store/Captures
          if-no-files-found: error
      - name: Save Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics-${{ github.run_number }}
          path: |
            .build/ios-build.log
            .build/ios-build.xcresult
            .build/ios-ui-tests.log
            .build/ios-ui-tests.xcresult
            .build/simulator-boot.log
          if-no-files-found: ignore
