name: Validate native game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate package, tooling and iOS build
        run: bash Tools/verify_macos.sh
      - name: Package simulator app
        run: |
          mkdir -p .build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            .build/ios-derived/Build/Products/Debug-iphonesimulator/ScrapSquad.app \
            .build/artifacts/ScrapSquad-simulator.zip
      - name: Save simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ScrapSquad-simulator-${{ github.run_number }}
          path: .build/artifacts/ScrapSquad-simulator.zip
          if-no-files-found: error
      - name: Save Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics-${{ github.run_number }}
          path: |
            .build/ios-build.log
            .build/ios-build.xcresult
          if-no-files-found: ignore
