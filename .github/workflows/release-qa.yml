name: Verify release accessibility and lifecycle
on:
  workflow_dispatch:
    inputs:
      test_class:
        description: Release checks to run
        type: choice
        options: [SalvageUITests, PremiumShopUITests, ReleaseReadinessUITests, CosmeticPurchaseUITests, CombatShowcaseUITests, ExcitementUITests, ExcitementUITests/testRealUpgradeRecipeWaveEventEvolutionAndCleanRetry, iOSDeviceHelper]
        default: ReleaseReadinessUITests
      family:
        description: Simulator family
        type: choice
        options: [both, iPhone, iPad Pro 13]
        default: both
permissions:
  contents: read
jobs:
  qa:
    if: inputs.test_class != 'iOSDeviceHelper'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.family == 'iPhone' && '["iPhone"]' || inputs.family == 'iPad Pro 13' && '["iPad Pro 13"]' || '["iPhone","iPad Pro 13"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Verify accessibility and lifecycle
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
          UI_TEST_CLASS: ${{ inputs.test_class || 'ReleaseReadinessUITests' }}
          UI_RESULT_NAME: release-qa
        run: bash Tools/test_ios_ui.sh
      - name: Export proof
        if: always()
        run: |
          if [ -d .build/release-qa.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/release-qa.xcresult --output-path .build/release-qa-captures
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa-${{ matrix.family }}
          include-hidden-files: true
          path: |
            .build/release-qa.log
            .build/release-qa.xcresult
            .build/release-qa-captures
  device-helper:
    if: inputs.test_class == 'iOSDeviceHelper'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      QA_DEVICE_UDID: ${{ secrets.SCRAP_IOS_QA_DEVICE_UDID }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare device-only test helper
        run: bash Tools/build_device_helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-test-helper
          path: .build/device-helper.zip
          retention-days: 3
