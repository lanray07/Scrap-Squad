name: Prepare App Review records
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-review-preflight
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'PyJWT[crypto]==2.10.1'
      - name: Verify release metadata
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          python Tools/release_assets.py --build 15
          python Tools/prepare_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-preflight
          include-hidden-files: true
          path: |
            .build/review-preflight.json
            .build/release-readiness.json
