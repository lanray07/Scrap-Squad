name: ScrapSquad
options:
  bundleIdPrefix: com.scrapsquad
  deploymentTarget:
    iOS: '17.0'
packages:
  ScrapSquad:
    path: .
targets:
  ScrapSquad:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ScrapSquad
        product: ScrapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ScrapSquad.app
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scrap Squad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_LANGUAGE: en
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Prepare app icon
        script: |
          /usr/bin/sips -z 1024 1024 "$SRCROOT/Art/AppIcon-source.png" --out "$SRCROOT/App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" > /dev/null
        inputFiles:
          - $(SRCROOT)/Art/AppIcon-source.png
        outputFiles:
          - $(SRCROOT)/App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    scheme:
      testTargets: [ScrapSquadUITests]
  ScrapSquadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ScrapSquad
    settings:
      base:
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
